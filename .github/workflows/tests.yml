name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run tests with pytest
      run: |
        pytest test_birthday_paradox.py -v --tb=short --cov=birthday_paradox --cov-report=term-missing
    
    - name: Test main script execution
      run: |
        python birthday_paradox.py
        if [ $? -ne 0 ]; then
          echo "Main script failed to execute"
          exit 1
        fi
      shell: bash
    
    - name: Test example script execution
      run: |
        python example.py
        if [ $? -ne 0 ]; then
          echo "Example script failed to execute"
          exit 1
        fi
      shell: bash
